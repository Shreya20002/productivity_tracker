<svg xmlns="http://www.w3.org/2000/svg" width="620" height="680" viewBox="0 0 620 680" role="img" aria-labelledby="title desc">
  <title id="title">Productivity Tracker main menu</title>
  <desc id="desc">A terminal window showing the tracker status (tracking Visual Studio Code) and the main menu with options 1 to 7 and 0 to exit.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1022" flood-opacity="0.35"/>
    </filter>
    <clipPath id="win">
      <rect x="20" y="12" width="580" height="644" rx="14"/>
    </clipPath>
  </defs>

  <!-- Window -->
  <g filter="url(#shadow)">
    <rect x="20" y="12" width="580" height="644" rx="14" fill="#0F1424"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="20" y="12" width="580" height="40" fill="#1A2038"/>
    <line x1="20" y1="52" x2="600" y2="52" stroke="#FFFFFF" stroke-opacity="0.06"/>
  </g>
  <rect x="20" y="12" width="580" height="644" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Traffic lights -->
  <circle cx="44" cy="32" r="6" fill="#FB7185"/>
  <circle cx="64" cy="32" r="6" fill="#FBBF24"/>
  <circle cx="84" cy="32" r="6" fill="#4ADE80"/>
  <text x="310" y="37" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">python -m productivity_tracker</text>

  <!-- Screen content (mirrors menu.py output); leading spaces are &#160; so they survive rendering -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" fill="#E2E8F0">
    <text x="44" y="84" fill="#475569">============================================================</text>
    <text x="44" y="103" fill="#F8FAFC" font-weight="700">&#160;&#160;&#160;&#160;&#160;&#160;&#160;SCREEN TIME &amp; APP USAGE TRACKER</text>
    <text x="44" y="122" fill="#94A3B8">&#160;&#160;&#160;&#160;&#160;&#160;&#160;File-Based Offline Tracker</text>
    <text x="44" y="141" fill="#475569">============================================================</text>

    <text x="44" y="186" fill="#475569">========================================</text>
    <text x="44" y="205" fill="#F8FAFC" font-weight="700">&#160;&#160;TRACKER STATUS</text>
    <text x="44" y="224" fill="#475569">========================================</text>
    <text x="44" y="243">&#160;&#160;Status: TRACKING</text>
    <text x="44" y="262">&#160;&#160;Current App: Visual Studio Code</text>
    <text x="44" y="281">&#160;&#160;Session Duration: 12m 41s</text>
    <text x="44" y="300">&#160;&#160;Sessions Recorded: 14</text>
    <text x="44" y="319">&#160;&#160;Total Tracked: 2h 37m 5s</text>
    <text x="44" y="338" fill="#475569">========================================</text>

    <text x="44" y="376" fill="#475569">----------------------------------------</text>
    <text x="44" y="395" fill="#F8FAFC" font-weight="700">&#160;&#160;MAIN MENU</text>
    <text x="44" y="414" fill="#475569">----------------------------------------</text>
    <text x="44" y="433">&#160;&#160;[1] Start tracking</text>
    <text x="44" y="452">&#160;&#160;[2] Stop tracking</text>
    <text x="44" y="471">&#160;&#160;[3] View today's usage</text>
    <text x="44" y="490">&#160;&#160;[4] View weekly summary</text>
    <text x="44" y="509">&#160;&#160;[5] View all-time statistics</text>
    <text x="44" y="528">&#160;&#160;[6] Clear old data</text>
    <text x="44" y="547">&#160;&#160;[7] Check system compatibility</text>
    <text x="44" y="566">&#160;&#160;[0] Exit</text>
    <text x="44" y="585" fill="#475569">----------------------------------------</text>

    <text x="44" y="623">&#160;&#160;Enter your choice: <tspan fill="#2DD4BF">█<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
