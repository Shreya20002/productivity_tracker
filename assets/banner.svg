<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Screen Time Tracker</title>
  <desc id="desc">Know where your hours go: offline, private, zero dependencies. A 24-hour timeline shows coloured app sessions across one day.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1022"/>
      <stop offset="0.55" stop-color="#141A3A"/>
      <stop offset="1" stop-color="#2A1745"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.15" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.9" cy="1" r="0.6">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="440" rx="24"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#glowTeal)"/>
    <rect width="1200" height="440" fill="url(#glowViolet)"/>
    <rect width="1200" height="440" fill="url(#dots)"/>
  </g>

  <!-- Command pill -->
  <rect x="396" y="56" width="408" height="40" rx="20" fill="#2DD4BF" fill-opacity="0.10" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <text x="600" y="82" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="17" fill="#5EEAD4"><tspan fill="#64748B">$ </tspan>python -m productivity_tracker</text>

  <!-- Title -->
  <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">Screen Time <tspan fill="url(#accent)">Tracker</tspan></text>

  <!-- Tagline -->
  <text x="600" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#CBD5E1">Know where your hours go — offline, private, zero dependencies.</text>

  <!-- Timeline label -->
  <text x="120" y="296" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="12" letter-spacing="2" fill="#94A3B8">ONE DAY, AS THE TRACKER SEES IT</text>
  <text x="830" y="298" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="12" fill="#5EEAD4">tracking…</text>

  <!-- Timeline track (00:00 → 24:00 maps to x 120 → 1080) -->
  <rect x="120" y="310" width="960" height="28" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Sessions: sky=Code, amber=Browser, violet=Docs, teal=Terminal, coral=Chat -->
  <g>
    <rect x="480"   y="314" width="24.8" height="20" rx="3" fill="#38BDF8"/>
    <rect x="506"   y="314" width="6"    height="20" rx="3" fill="#2DD4BF"/>
    <rect x="513.2" y="314" width="38"   height="20" rx="3" fill="#38BDF8"/>
    <rect x="552.4" y="314" width="27.6" height="20" rx="3" fill="#FBBF24"/>
    <rect x="581.2" y="314" width="6.8"  height="20" rx="3" fill="#A78BFA"/>
    <rect x="589.2" y="314" width="32.8" height="20" rx="3" fill="#FBBF24"/>
    <rect x="623.2" y="314" width="8.8"  height="20" rx="3" fill="#FB7185"/>
    <rect x="660"   y="314" width="56"   height="20" rx="3" fill="#38BDF8"/>
    <rect x="717.2" y="314" width="12.8" height="20" rx="3" fill="#FB7185"/>
    <rect x="731.2" y="314" width="44.8" height="20" rx="3" fill="#FBBF24"/>
    <rect x="777.2" y="314" width="12.8" height="20" rx="3" fill="#2DD4BF"/>
    <rect x="791.2" y="314" width="38.8" height="20" rx="3" fill="#38BDF8"/>
  </g>

  <!-- "Now" pulse -->
  <circle cx="830" cy="324" r="5" fill="#2DD4BF"/>
  <circle cx="830" cy="324" r="5" fill="none" stroke="#2DD4BF" stroke-width="2">
    <animate attributeName="r" values="5;15" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Hour ticks -->
  <g stroke="#475569" stroke-width="1.5">
    <line x1="120"  y1="344" x2="120"  y2="350"/>
    <line x1="360"  y1="344" x2="360"  y2="350"/>
    <line x1="600"  y1="344" x2="600"  y2="350"/>
    <line x1="840"  y1="344" x2="840"  y2="350"/>
    <line x1="1080" y1="344" x2="1080" y2="350"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="13" fill="#64748B" text-anchor="middle">
    <text x="120"  y="368">00:00</text>
    <text x="360"  y="368">06:00</text>
    <text x="600"  y="368">12:00</text>
    <text x="840"  y="368">18:00</text>
    <text x="1080" y="368">24:00</text>
  </g>

  <!-- Legend -->
  <text x="600" y="410" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8"><tspan fill="#38BDF8">●</tspan> Code<tspan dx="22" fill="#FBBF24">●</tspan> Browser<tspan dx="22" fill="#A78BFA">●</tspan> Docs<tspan dx="22" fill="#2DD4BF">●</tspan> Terminal<tspan dx="22" fill="#FB7185">●</tspan> Chat</text>
</svg>
